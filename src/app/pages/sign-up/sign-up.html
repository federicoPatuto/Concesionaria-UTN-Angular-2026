<div class="signup-page">

  <div class="signup-container">

    <div class="foto-registro">

      <img [src]="newUser.foto || avatarDefault" >

      <label class="btn-foto">
        Elegir foto

        <input
          type="file"
          accept="image/*"
          (change)="onFotoSeleccionada($event)">
      </label>

    </div>

    <div class="datos-registro">

      <h2>Crear cuenta</h2>

      <form (ngSubmit)="singUp()" #form="ngForm">

        <div class="campo">
          <label>Nombre</label>
          <input
            type="text"
            [(ngModel)]="newUser.nombre"
            name="nombre"
            required>
        </div>

        <div class="campo">
          <label>Email</label>
          <input
            type="email"
            [(ngModel)]="newUser.email"
            name="email"
            required>
        </div>

        <div class="campo">
          <label>Teléfono</label>
          <input
            type="text"
            [(ngModel)]="newUser.telefono"
            name="telefono"
            required>
        </div>

        <div class="campo">
          <label>Contraseña</label>
          <input
            type="password"
            [(ngModel)]="newUser.password"
            name="contraseña"
            required>
        </div>

        <button
          class="btn-registrarse"
          type="submit"
          [disabled]="form.invalid">
          Registrarse
        </button>

      </form>

    </div>

  </div>

</div>
