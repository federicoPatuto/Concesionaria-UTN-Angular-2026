<div class="login-page">

  <div class="login-container">

    <h2>Iniciar sesión</h2>

    <form (ngSubmit)="login()" #form="ngForm">

      <div class="campo">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="loginData.email"
          name="email"
          required>
      </div>

      <div class="campo">
        <label>Contraseña</label>
        <input
          type="password"
          [(ngModel)]="loginData.password"
          name="password"
          required>
      </div>

      @if(errorMessage){
        <div class="error-login">
          {{ errorMessage }}
        </div>
      }

      <button
        class="btn-ingresar"
        type="submit"
        [disabled]="form.invalid">

        Ingresar

      </button>

    </form>

    <p class="registro">
      ¿Usuario nuevo?
      <a routerLink="/sign-up" routerLinkActive="active">
        Registrarse
      </a>
    </p>

  </div>

</div>
